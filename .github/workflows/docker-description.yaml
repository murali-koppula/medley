name: Sync Docker Hub Description

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    paths:
      - 'DOCKER.md'
    branches:
      - main

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync DOCKER.md to Docker Hub using API
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SHORT_DESC: ${{ github.event.repository.description }}
        run: |
          echo "Authenticating with Docker Hub..."
          
          # 1. Fetch the JWT token using your credentials
          JWT=$(curl -sSLkf -X POST -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          if [ "$JWT" = "null" ] || [ -z "$JWT" ]; then
            echo "Error: Failed to retrieve JWT token. Check your credentials."
            exit 1
          fi

          echo "Constructing JSON payload..."
          
          # 2. Use jq to safely escape the file contents and inject it into valid JSON
          PAYLOAD=$(jq -n \
            --arg short "${SHORT_DESC:-MeDLey — Interactive pipeline for media downloading and post-processing.}" \
            --rawfile full ./DOCKER.md \
            '{description: $short, full_description: $full}')

          echo "Pushing description to Docker Hub..."
          
          # 3. Execute the PATCH request
          HTTP_CODE=$(curl -sSL -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: JWT $JWT" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            -d "$PAYLOAD" \
            https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/medley/)

          # 4. Check for success
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Successfully updated repository description!"
          else
            echo "Error: Failed to update description. HTTP Status Code: $HTTP_CODE"
            exit 1
          fi